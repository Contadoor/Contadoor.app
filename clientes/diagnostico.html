<head>

<style id="gestoor-auth-guard">html.auth-pending body{visibility:hidden !important;}</style>
<style>
  .layout{display:flex;min-height:100vh}
  .sidebar{display:flex;flex-direction:column;position:fixed;height:100vh;z-index:20;top:0;left:0}
  .main{flex:1;min-height:100vh;min-width:0}
  .topbar{display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:10}
  .topbar .tb-title{font:900 22px/1 Montserrat,Arial,sans-serif;color:#fff;margin:0}.topbar .tb-title span{color:#C77BC9}.topbar p{margin:3px 0 0;font-size:12px;color:#C9A8CC}
  .content{padding:16px 28px 60px}
  .dg-cab h2{font-family:Montserrat,Arial,sans-serif;font-weight:800;font-size:20px;margin:0 0 12px;color:#F3E9F4;border-left:4px solid #924893;padding-left:10px}
  .dg-cab h2 span{display:block;font-family:Inter,Arial,sans-serif;font-weight:500;font-size:13px;color:#C9B6CC;margin-top:2px}
  .dg-aviso{background:#221027;border:1px solid #4A2B50;border-radius:12px;padding:10px 14px;margin:0 0 10px;color:#F3E9F4;font-size:13px}
  .dg-aviso.err,.dg-res.err,.dg-res .err{color:#FF9B8F}
  .dg-grid{display:grid;grid-template-columns:minmax(320px,420px) 1fr;gap:16px;align-items:start}
  .dg-panel{display:flex;flex-direction:column;gap:12px}
  .dg-bloque{min-width:0;background:#221027;border:1px solid #4A2B50;border-radius:16px;padding:12px 14px;margin:0;color:#F3E9F4}
  .dg-bloque legend{font-family:Montserrat,Arial,sans-serif;font-weight:800;font-size:13px;padding:0 6px;color:#C77BC9}
  .dg-fila{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12.5px;margin:6px 0}
  .dg-fila span{flex:1}
  .dg-bloque select,.dg-bloque input,.dg-bloque textarea{background:#17091A;color:#F3E9F4;border:1px solid #4A2B50;border-radius:8px;padding:6px 8px;font:inherit;font-size:12.5px}
  .dg-bloque textarea,#dg-cita{width:100%;margin-top:6px;box-sizing:border-box}
  .dg-item{display:grid;grid-template-columns:minmax(0,1fr) 46px 64px auto 26px;gap:6px;align-items:center;margin:6px 0}
  .dg-chk{font-size:10.5px;display:flex;gap:3px;align-items:center;white-space:nowrap}
  .dg-x{background:none;border:1px solid #4A2B50;color:#F3E9F4;border-radius:8px;cursor:pointer;height:28px}
  #dg-plan-uf{width:80px}
  .dg-btn{background:linear-gradient(135deg,#A4599C,#924893 55%,#803889);color:#fff;border:0;border-radius:10px;padding:9px 14px;font-weight:700;font-size:13px;cursor:pointer;text-decoration:none;display:inline-block}
  .dg-btn.sec{background:#2C1531;border:1px solid #4A2B50}
  .dg-btn:disabled{opacity:.5;cursor:default}
  .dg-acc{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.dg-acc small{color:#C9B6CC}
  .dg-res{font-size:13px;color:#F3E9F4;display:flex;flex-direction:column;gap:6px;word-break:break-all}.dg-res a{color:#5CC8FF}
  .dg-anteriores{display:flex;flex-direction:column;gap:4px;font-size:12px;color:#C9B6CC}.dg-anteriores a{color:#C77BC9}
  .dg-prev{background:#fff;border-radius:16px;overflow:hidden;border:1px solid #4A2B50}
  .dg-prev iframe{width:100%;height:calc(100vh - 150px);min-height:640px;border:0;display:block}
  .dg-prev.solo{margin-top:12px}
  @media (max-width:980px){.dg-grid{grid-template-columns:1fr}}
</style>
</head>

</main>
