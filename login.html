
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gestoor · Acceso</title>
<link rel="icon" type="image/svg+xml" href="assets/gestoor-icono.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">
<style>
/* Acceso a Gestoor · tema "Todo oscuro" (solo apariencia; IDs y lógica sin cambio) */
:root{--p:#924893;--pd:#803889;--acento:#C77BC9;--cifra:#E39BE5;--tinta:#F3E9F4;--tinta2:#C9A8CC;--tinta3:#8F6F94;--borde:#4A2B50;
  --grad:linear-gradient(135deg,#A4599C,#924893 55%,#803889);--titulo:Montserrat,system-ui,sans-serif;--texto:Inter,system-ui,sans-serif;--sans:var(--texto)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{font-family:var(--texto);color:var(--tinta);background:#0C070E;background-image:radial-gradient(120% 80% at 20% 0%,#2A1235 0%,#17091A 50%,#0C070E 100%);
  min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px;position:relative;overflow-x:hidden}
/* barritas diagonales de la marca (estilo reels) */
body::before,body::after{content:"";position:fixed;z-index:0;border-radius:40px;transform:rotate(20deg);pointer-events:none}
body::before{right:-40px;top:-80px;width:46px;height:420px;background:linear-gradient(160deg,#A4599C,#803889);opacity:.35;
  box-shadow:-80px 60px 0 -6px rgba(164,89,156,.22),-160px 120px 0 -12px rgba(164,89,156,.12)}
body::after{left:-60px;bottom:-120px;width:40px;height:360px;background:linear-gradient(160deg,#A4599C,#803889);opacity:.22;
  box-shadow:90px -40px 0 -6px rgba(164,89,156,.14)}
.lcard{width:100%;max-width:400px;position:relative;z-index:1}
.logo-z{text-align:center;margin-bottom:22px}
.g-marca{display:inline-flex;align-items:center;gap:12px}
.g-marca .ic{width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.12);display:grid;place-items:center;box-shadow:0 10px 30px rgba(146,72,147,.35)}
.g-marca .ic img{width:44px;height:44px;display:block}
.g-marca .nom{font:900 30px var(--titulo);letter-spacing:-.01em;color:#fff}
.g-marca .nom span{color:#F6D3F7}
.app-s{font:600 11px var(--texto);color:var(--tinta3);text-transform:uppercase;letter-spacing:1.8px;margin-top:8px}
.app-s b{color:var(--acento);font-weight:700}
.card{background:linear-gradient(180deg,rgba(34,16,39,.92),rgba(23,9,26,.92));border:1px solid var(--borde);border-radius:24px;padding:28px 26px;
  box-shadow:0 24px 60px rgba(0,0,0,.55);backdrop-filter:blur(6px)}
.step-lbl{font:800 20px var(--titulo);color:var(--tinta);margin-bottom:4px}
.step-sub{font-size:13px;color:var(--tinta2);margin-bottom:18px}
.inp-wrap{position:relative;margin-bottom:12px}
.inp-ico{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--tinta3);pointer-events:none;display:grid}
.inp-ico svg,.inp-eye svg{width:18px;height:18px}
.inp-eye{position:absolute;right:8px;top:50%;transform:translateY(-50%);color:var(--tinta3);cursor:pointer;background:none;border:none;padding:8px;line-height:0;border-radius:10px}
.inp-eye:hover{color:var(--tinta);background:rgba(255,255,255,.05)}
.inp{width:100%;min-height:50px;background:#12080f;border:1px solid var(--borde);border-radius:14px;padding:0 44px;font:500 15px var(--texto);color:var(--tinta);outline:none;transition:border-color .15s,box-shadow .15s}
.inp::placeholder{color:var(--tinta3)}
.inp:focus{border-color:var(--acento);box-shadow:0 0 0 3px rgba(199,123,201,.2)}
.inp.err{border-color:#FF6B6B;box-shadow:0 0 0 3px rgba(255,107,107,.15)}
.check-row{display:flex;align-items:center;gap:9px;margin:6px 0 18px}
.check-row input[type=checkbox]{width:17px;height:17px;accent-color:var(--acento);cursor:pointer;flex-shrink:0}
.check-row label{font-size:13px;color:var(--tinta2);cursor:pointer}
.btn-p{width:100%;min-height:50px;background:var(--grad);border:none;border-radius:999px;font:700 15px var(--texto);color:#fff;cursor:pointer;
  box-shadow:0 10px 26px rgba(146,72,147,.4);transition:transform .15s,box-shadow .15s}
.btn-p:hover{transform:translateY(-1px);box-shadow:0 14px 32px rgba(146,72,147,.5)}
.btn-p:focus-visible,.olvide:focus-visible,.inp-eye:focus-visible{outline:3px solid var(--acento);outline-offset:2px}
.btn-p:disabled{opacity:.5;cursor:not-allowed;transform:none}
.err-msg{font-size:13px;color:#FF8A8A;margin-top:10px;min-height:18px;text-align:center}
.olvide{display:block;text-align:center;margin-top:10px;font:600 13px var(--texto);color:var(--acento);cursor:pointer;background:none;border:none;width:100%;padding:8px}
.olvide:hover{color:var(--cifra)}
.footer{text-align:center;margin-top:18px}
.footer-line{font-size:11px;color:var(--tinta3);letter-spacing:.3px}
.divider{width:40px;height:2px;border-radius:2px;background:var(--grad);margin:10px auto;opacity:.6}
.slogan{font-size:12px;color:var(--tinta2);font-style:italic}
.loading-dots{display:inline-flex;gap:4px;margin-left:8px;vertical-align:middle}
.loading-dots span{width:5px;height:5px;border-radius:50%;background:#fff;animation:ld .8s infinite both}
.loading-dots span:nth-child(2){animation-delay:.15s}
.loading-dots span:nth-child(3){animation-delay:.3s}
@keyframes ld{0%,80%,100%{opacity:.2}40%{opacity:1}}
.ok-msg{font-size:14px;color:#5FE3AE;text-align:center;margin-top:12px;line-height:1.6;display:none}
@media (prefers-reduced-motion:reduce){.loading-dots span{animation:none}.btn-p{transition:none}}
</style>
</head>
<body>
<div class="lcard">
  <div class="logo-z">
    <div class="g-marca" role="img" aria-label="Gestoor">
      <span class="ic"><img src="assets/gestoor-icono.svg" alt=""></span>
      <span class="nom">Gest<span>oor</span></span>
    </div>
    <div class="app-s">Sistema de gestión interno · <b>by Contadoor</b></div>
  </div>
  <div class="card" id="cardLogin">
    <!-- INICIO DE SESIÓN -->
    <div id="panelLogin">
      <div class="step-lbl">Iniciar sesión</div>
      <div class="step-sub">Bienvenido de vuelta 👋</div>
      <div class="inp-wrap">
        <span class="inp-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg></span>
        <input class="inp" type="email" id="inp-email" placeholder="Correo electrónico" autocomplete="email"/>
      </div>
      <div class="inp-wrap">
        <span class="inp-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></span>
        <input class="inp" type="password" id="inp-pass" placeholder="Contraseña" autocomplete="current-password"/>
        <button type="button" class="inp-eye" id="btn-eye" title="Mostrar/ocultar contraseña" aria-label="Mostrar u ocultar contraseña"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/></svg></button>
      </div>
      <div class="check-row">
        <input type="checkbox" id="chk-recordar" checked>
        <label for="chk-recordar">Recordar mi correo</label>
      </div>
      <button class="btn-p" id="btn-login">Iniciar sesión</button>
      <div class="err-msg" id="err-login"></div>
      <button type="button" class="olvide" id="btn-olvide">¿Olvidaste tu contraseña?</button>
    </div>
    <!-- RECUPERAR CONTRASEÑA -->
    <div id="panelRecuperar" style="display:none">
      <div class="step-lbl">Recuperar contraseña</div>
      <div class="step-sub">Te enviaremos un enlace a tu correo.</div>
      <div class="inp-wrap">
        <span class="inp-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg></span>
        <input class="inp" type="email" id="inp-email-rec" placeholder="Tu correo electrónico" autocomplete="email"/>
      </div>
      <button class="btn-p" id="btn-enviar-rec">Enviar instrucciones</button>
      <div class="err-msg" id="err-rec"></div>
      <div class="ok-msg" id="ok-rec">
        Revisa tu correo.<br>Recibirás un enlace para restablecer tu contraseña.
      </div>
      <button type="button" class="olvide" id="btn-volver-login">← Volver al inicio de sesión</button>
    </div>
  </div>
  <div class="footer">
    <div class="footer-line">Contadoor Chile · Solo uso interno autorizado</div>
    <div class="divider"></div>
    <div class="slogan">Somos la puerta a tu solución</div>
  </div>
</div>

<!-- Supabase JS SDK (v2) -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
var SB_URL='https://ulxoxqbuxiuylaolaqxj.supabase.co';
var SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVseG94cWJ1eGl1eWxhb2xhcXhqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQxNDMwNDcsImV4cCI6MjA5OTcxOTA0N30.bN_KeSJFEBKSBzwTixRQs92y6aEhBo-SJs4fGxZgAbA';

// Crear cliente Supabase
var sbClient=window.supabase.createClient(SB_URL,SB_KEY,{
  auth:{autoRefreshToken:true,persistSession:true,detectSessionInUrl:true}
});

// Redireccionamiento por rol
var ROL_DESTINOS={
  master:   'index.html',
  admin:    'index.html',
  rrhh:     'reportes-rrhh/index.html',
  contable: 'reportes-contable/index.html',
  pagos:    'reportes-pagos/index.html',
  cobranza: 'cobranza/index.html',
  comercial:'clientes/index.html'
};

function setBtn(btn,html,disabled){btn.innerHTML=html;btn.disabled=!!disabled;}
function setErr(id,msg){document.getElementById(id).textContent=msg||'';}

// ── INICIO DE SESIÓN ──────────────────────────────────────────────────────────
document.getElementById('btn-login').onclick=function(){
  var email=(document.getElementById('inp-email').value||'').trim();
  var pass=document.getElementById('inp-pass').value||'';
  setErr('err-login','');

  if(!email||!pass){
    setErr('err-login','Ingresa tu correo y contraseña.');
    return;
  }

  var btn=document.getElementById('btn-login');
  setBtn(btn,'Verificando<span class="loading-dots"><span></span><span></span><span></span></span>',true);

  sbClient.auth.signInWithPassword({email:email,password:pass})
    .then(function(result){
      if(result.error){
        setBtn(btn,'Iniciar sesión',false);
        // Mensaje genérico — nunca revelar si el email existe o no
        setErr('err-login','Correo o contraseña incorrectos.');
        return;
      }

      var authUser=result.data.user;

      // Cargar perfil desde public.usuarios
      return sbClient.from('usuarios')
        .select('id,nombre,iniciales,rol,rol_label,es_master,activo,modulos,wa,email')
        .eq('auth_user_id',authUser.id)
        .single()
        .then(function(profileResult){
          var perfil=profileResult.data;
          var err=profileResult.error;

          if(err||!perfil){
            sbClient.auth.signOut();
            sessionStorage.removeItem('usuario_activo');
            setBtn(btn,'Iniciar sesión',false);
            setErr('err-login','Tu cuenta no está configurada en Gestoor. Contacta al administrador.');
            return;
          }
          if(!perfil.activo){
            sbClient.auth.signOut();
            sessionStorage.removeItem('usuario_activo');
            setBtn(btn,'Iniciar sesión',false);
            setErr('err-login','Tu cuenta está desactivada. Contacta al administrador.');
            return;
          }

          // Guardar email si "recordarme" está marcado
          var recordar=document.getElementById('chk-recordar').checked;
          if(recordar){
            localStorage.setItem('gestoor_email_guardado',email);
          }else{
            localStorage.removeItem('gestoor_email_guardado');
          }

          // Cache visual para módulos (formato compatible con módulos existentes)
          var sesion={
            id:perfil.id,
            nombre:perfil.nombre,
            iniciales:perfil.iniciales||(perfil.nombre.split(' ').map(function(w){return w[0];}).join('').slice(0,2).toUpperCase()),
            rol:perfil.rol,
            rolLabel:perfil.rol_label||perfil.rol,
            email:perfil.email||authUser.email||'',
            wa:perfil.wa||'',
            esMaster:perfil.es_master===true,
            modulos:perfil.modulos||[],
            tsLogin:Date.now()
          };
          sessionStorage.setItem('usuario_activo',JSON.stringify(sesion));

          // Redirigir según rol
          var destino=ROL_DESTINOS[perfil.rol]||'index.html';
          window.location.href=destino;
        });
    })
    .catch(function(e){
      console.error('[login] Error:',e);
      setBtn(btn,'Iniciar sesión',false);
      setErr('err-login','Error de conexión. Intenta de nuevo.');
    });
};

// ── MOSTRAR/OCULTAR CONTRASEÑA ────────────────────────────────────────────────
document.getElementById('btn-eye').onclick=function(){
  var inp=document.getElementById('inp-pass');
  inp.type=inp.type==='password'?'text':'password';
};

// ── NAVEGACIÓN ENTRE PANELES ──────────────────────────────────────────────────
document.getElementById('btn-olvide').onclick=function(){
  document.getElementById('panelLogin').style.display='none';
  document.getElementById('panelRecuperar').style.display='block';
  // Pre-llenar email si ya lo escribió
  var emailActual=document.getElementById('inp-email').value||'';
  if(emailActual) document.getElementById('inp-email-rec').value=emailActual;
  setErr('err-rec','');
  document.getElementById('ok-rec').style.display='none';
};
document.getElementById('btn-volver-login').onclick=function(){
  document.getElementById('panelRecuperar').style.display='none';
  document.getElementById('panelLogin').style.display='block';
};

// ── RECUPERAR CONTRASEÑA ──────────────────────────────────────────────────────
document.getElementById('btn-enviar-rec').onclick=function(){
  var email=(document.getElementById('inp-email-rec').value||'').trim();
  setErr('err-rec','');
  document.getElementById('ok-rec').style.display='none';

  if(!email||!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){
    setErr('err-rec','Ingresa un correo válido.');
    return;
  }

  var btn=document.getElementById('btn-enviar-rec');
  setBtn(btn,'Enviando<span class="loading-dots"><span></span><span></span><span></span></span>',true);

  // Usar la URL real del proyecto (GitHub Pages o dominio futuro)
  // Supabase Dashboard → Auth → URL Configuration → Redirect URLs
  // debe incluir esta URL en la lista blanca
  var resetUrl=window.location.origin+window.location.pathname.replace('login.html','reset-password.html');

  sbClient.auth.resetPasswordForEmail(email,{redirectTo:resetUrl})
    .then(function(result){
      setBtn(btn,'Enviar instrucciones',false);
      if(result.error){
        // Error genérico — no confirmar si el email existe
        console.error('[login] resetPassword error:',result.error);
      }
      // Siempre mostrar mensaje de éxito (evita enumeration attack)
      document.getElementById('ok-rec').style.display='block';
    })
    .catch(function(e){
      console.error('[login] resetPassword excepción:',e);
      setBtn(btn,'Enviar instrucciones',false);
      setErr('err-rec','Error de conexión. Intenta de nuevo.');
    });
};

// ── ENTER EN CAMPOS ───────────────────────────────────────────────────────────
document.getElementById('inp-email').addEventListener('keydown',function(e){
  if(e.key==='Enter') document.getElementById('inp-pass').focus();
});
document.getElementById('inp-pass').addEventListener('keydown',function(e){
  if(e.key==='Enter') document.getElementById('btn-login').onclick();
});
document.getElementById('inp-email-rec').addEventListener('keydown',function(e){
  if(e.key==='Enter') document.getElementById('btn-enviar-rec').onclick();
});

// ── LIMPIAR ERRORES AL ESCRIBIR ───────────────────────────────────────────────
['inp-email','inp-pass'].forEach(function(id){
  document.getElementById(id).addEventListener('input',function(){
    setErr('err-login','');
    this.classList.remove('err');
  });
});

// ── INIT: si ya hay sesión válida, redirigir al dashboard ─────────────────────
(function(){
  // Pre-llenar email guardado
  var emailGuardado=localStorage.getItem('gestoor_email_guardado')||'';
  if(emailGuardado){
    document.getElementById('inp-email').value=emailGuardado;
    document.getElementById('chk-recordar').checked=true;
  }

  // Verificar identidad real contra Supabase (no solo cache local)
  sbClient.auth.getUser().then(function(result){
    var user=result.data&&result.data.user;
    var authErr=result.error;

    if(authErr||!user){
      // Sin usuario válido — limpiar cache y permanecer en login
      sessionStorage.removeItem('usuario_activo');
      return;
    }

    // Usuario autenticado — verificar perfil activo en public.usuarios
    sbClient.from('usuarios')
      .select('rol,es_master,activo,auth_user_id')
      .eq('auth_user_id',user.id)
      .single()
      .then(function(pr){
        if(pr.data&&pr.data.activo){
          // Perfil válido y activo → redirigir según rol
          var destino=ROL_DESTINOS[pr.data.rol]||'index.html';
          window.location.href=destino;
        }else{
          // Perfil no existe, consulta falló o activo=false → signOut + limpiar
          sbClient.auth.signOut().catch(function(){});
          sessionStorage.removeItem('usuario_activo');
        }
      }).catch(function(){
        // Error de red/BD — signOut preventivo y permanecer en login
        sbClient.auth.signOut().catch(function(){});
        sessionStorage.removeItem('usuario_activo');
      });
  }).catch(function(){
    // Error inesperado — permanecer en login sin mostrar error técnico
    sessionStorage.removeItem('usuario_activo');
  });
})();
</script>
</body>
</html>
