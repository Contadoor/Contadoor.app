<!DOCTYPE html>
<html lang="es" class="auth-pending">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MiRenta · Preparemos tu Renta 2027 · Gestoor</title>
<link rel="icon" type="image/svg+xml" href="../assets/mirenta-icono.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="proyeccion.css">
<link rel="stylesheet" href="../assets/gestoor.css">
<link rel="stylesheet" href="../assets/equipo.css">
<link rel="stylesheet" href="preparacion.css">
<style id="gestoor-auth-guard">html.auth-pending body{visibility:hidden !important;}</style>
<script>
/* Modo demostración (candado 1 de 2): SOLO con ?demo=1 y SOLO en localhost / 127.0.0.1 / [::1]. En cualquier otro host la página exige sesión. */
(function(){
  var h=location.hostname, local=(h==='localhost'||h==='127.0.0.1'||h==='[::1]');
  window.PR_DEMO=local&&/(?:^|[?&])demo=1(?:&|$)/.test(location.search.slice(1));
})();
</script>
</head>
<body class="g-shell g-tema-noche g-mod-mrp g-mod-prep">
<div class="layout">
<aside class="sidebar" data-gestoor-activo="pir" data-gestoor-pagina="preparacion.html"></aside>
<script src="../assets/gestoor-menu.js"></script>
<main class="main">
  <div class="topbar mrp-top">
    <div class="mrp-marca">
      <img class="mrp-ico" src="../assets/mirenta-icono.svg" alt="" width="40" height="40">
      <div><h1 class="tb-title">Mi<span>Renta</span></h1><p>Preparemos tu Renta 2027 · lo que nos cuentan los clientes antes del 31 de diciembre</p></div>
    </div>
    <div class="g-espacio"></div>
    <span class="mrp-demo" id="prDemo" hidden title="Datos ficticios locales: no se conecta a Supabase y nada se guarda">DEMO LOCAL · DATOS FICTICIOS</span>
    <button type="button" class="g-btn sm" id="prCampana" hidden><i class="ic ic-ama" data-ic="megafono"></i><span>Campaña</span></button>
    <a class="g-btn sm mrp-volver" href="proyeccion.html" title="Ir a la Cartera de Renta (proyección)"><i class="ic ic-cel" data-ic="flecha-izq"></i>Cartera de Renta</a>
  </div>
  <div class="content">
    <div id="prApp" class="mrp-app"><div class="aviso lila"><span class="mrp-spin"></span>Cargando Preparemos tu Renta…</div></div>
  </div>
</main>
</div>

<div class="mrp-velo" id="prVelo"></div>
<div class="mrp-modal" id="prModal" role="dialog" aria-modal="true" aria-labelledby="prModalTit" hidden><div id="prModalCuerpo"></div></div>
<div class="mrp-toast" id="prToast" role="status" aria-live="polite"></div>

<script src="../supabase.js"></script>
<script src="../assets/equipo.js"></script>
<script>if(window.PR_DEMO)document.write('<script src="preparacion-demo.js"><\/script>');</script>
<script src="preparacion.js"></script>
<script>if(!window.PR_DEMO)document.write('<script src="../notifications.js"><\/script><script src="../auth.js"><\/script>');</script>
</body>
</html>
