
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>SimpleAPI RCV — Prueba técnica</title>
<style>
  body{font-family:sans-serif;max-width:680px;margin:40px auto;padding:0 20px;color:#1a0a1b;}
  h2{color:#904891;}
  .fgroup{margin-bottom:14px;}
  label{display:block;font-size:12px;font-weight:700;color:#5c4a5d;margin-bottom:4px;text-transform:uppercase;}
  input,select{width:100%;padding:9px 12px;border:1.5px solid #e8dde8;border-radius:8px;
    font-size:14px;box-sizing:border-box;}
  button{padding:12px 24px;background:#904891;color:#fff;border:none;border-radius:8px;
    font-size:15px;font-weight:700;cursor:pointer;}
  button:disabled{opacity:.5;cursor:not-allowed;}
  pre{background:#f5f0f5;border-radius:8px;padding:16px;font-size:11px;
    overflow:auto;max-height:400px;white-space:pre-wrap;word-break:break-all;}
  .msg{padding:10px 14px;border-radius:8px;margin-top:12px;font-size:13px;}
  .ok{background:#d1fae5;color:#065f46;}
  .err{background:#fee2e2;color:#991b1b;}
  .note{background:#eff6ff;color:#1e3a5f;padding:12px;border-radius:8px;font-size:12px;margin-bottom:20px;}
</style>
</head>
<body>

<h2>SimpleAPI RCV — Prueba de integración</h2>

<div class="note">
  <strong>Solo prueba técnica.</strong> No modifica reportes_mensuales ni calcula F29.<br>
  El JWT se obtiene automáticamente desde la sesión activa de Gestoor.
</div>

<div class="fgroup">
  <label>Tipo</label>
  <select id="tipo">
    <option value="ventas">Ventas</option>
    <option value="compras">Compras</option>
  </select>
</div>

<div class="fgroup">
  <label>Período (AAAA-MM)</label>
  <input id="periodo" type="text" placeholder="2026-07" maxlength="7"/>
</div>

<div class="fgroup">
  <label>RUT Empresa</label>
  <input id="rutEmpresa" type="text" placeholder="12345678-9"/>
</div>

<div class="fgroup">
  <label>RUT Certificado</label>
  <input id="rutCertificado" type="text" placeholder="12345678-9"/>
</div>

<div class="fgroup">
  <label>Contraseña del Certificado</label>
  <input id="passwordCertificado" type="password" placeholder="contraseña del .pfx" autocomplete="off"/>
</div>

<div class="fgroup">
  <label>Certificado Digital (.pfx / .p12)</label>
  <input id="certificado" type="file" accept=".pfx,.p12"/>
</div>

<button id="btn-consultar" onclick="consultarRCV()">Consultar RCV</button>

<div id="msg-estado"></div>
<pre id="resultado" style="display:none"></pre>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
(function(){
  'use strict';

  // ── Conexión al proyecto (anon key pública) ─────────────────────────────
  var SB_URL = 'https://ulxoxqbuxiuylaolaqxj.supabase.co';
  var SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVseG94cWJ1eGl1eWxhb2xhcXhqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQxNDMwNDcsImV4cCI6MjA5OTcxOTA0N30.bN_KeSJFEBKSBzwTixRQs92y6aEhBo-SJs4fGxZgAbA';

  var sbClient = window.supabase.createClient(SB_URL, SB_KEY, {
    auth: { autoRefreshToken: true, persistSession: true, detectSessionInUrl: true },
  });

  var EDGE_URL = SB_URL + '/functions/v1/simpleapi-rcv-test';

  function mostrarMsg(txt, tipo){
    var el = document.getElementById('msg-estado');
    el.className = 'msg ' + (tipo === 'ok' ? 'ok' : 'err');
    el.textContent = txt;
  }

  window.consultarRCV = async function(){
    var btn = document.getElementById('btn-consultar');
    var res = document.getElementById('resultado');

    // 1. Obtener JWT activo
    var sessionResult = await sbClient.auth.getSession();
    var session = sessionResult && sessionResult.data && sessionResult.data.session;
    if(!session || !session.access_token){
      mostrarMsg('❌ Sin sesión activa. Inicia sesión en Gestoor primero.', 'err');
      return;
    }

    // 2. Validar archivo
    var archivoEl = document.getElementById('certificado');
    if(!archivoEl.files || !archivoEl.files[0]){
      mostrarMsg('❌ Selecciona el certificado .pfx o .p12.', 'err');
      return;
    }

    btn.disabled = true;
    btn.textContent = '⏳ Consultando…';
    res.style.display = 'none';
    document.getElementById('msg-estado').textContent = '';

    try {
      // 3. Construir FormData — sin Content-Type manual
      var fd = new FormData();
      fd.append('tipo',                 document.getElementById('tipo').value);
      fd.append('periodo',              document.getElementById('periodo').value.trim());
      fd.append('rutEmpresa',           document.getElementById('rutEmpresa').value.trim());
      fd.append('rutCertificado',       document.getElementById('rutCertificado').value.trim());
      fd.append('passwordCertificado',  document.getElementById('passwordCertificado').value);
      fd.append('certificado',          archivoEl.files[0]);

      // 4. Invocar Edge Function con JWT explícito y apikey pública del proyecto
      var response = await fetch(EDGE_URL, {
        method: 'POST',
        headers: {
          'Authorization': 'Bearer ' + session.access_token,
          'apikey':        SB_KEY,
          // Content-Type NO se incluye: fetch lo calcula con el boundary correcto
        },
        body: fd,
      });

      var data = await response.json();

      if(data.ok){
        mostrarMsg(
          '✅ Consulta OK — HTTP ' + data.simpleApiStatus +
          (data.cantidadAproximada !== null
            ? ' — ~' + data.cantidadAproximada + ' documentos'
            : ''),
          'ok'
        );
      }else{
        mostrarMsg('❌ ' + (data.message || 'Error desconocido') + ' [' + (data.code||'?') + ']', 'err');
      }

      res.style.display = 'block';
      res.textContent = JSON.stringify(data, null, 2);

    }catch(e){
      mostrarMsg('❌ Error de red: ' + (e.message || e), 'err');
    }finally{
      // Limpiar secretos del formulario — ocurre siempre (éxito, error SimpleAPI, error de red)
      // No limpiar rutEmpresa, rutCertificado, periodo ni tipo (útiles para diagnóstico/reintento)
      document.getElementById('passwordCertificado').value = '';
      document.getElementById('certificado').value = '';

      btn.disabled = false;
      btn.textContent = 'Consultar RCV';
    }
  };

})();
</script>
</body>
</html>
