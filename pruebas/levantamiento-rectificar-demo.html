<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Demo · Si rectificamos todo</title>
<link rel="stylesheet" href="../assets/gestoor.css">
<style>body{background:#140B17;color:#F3E9F4;font-family:Inter,sans-serif;padding:24px}</style>
</head>
<body class="g-shell g-tema-noche">
<!-- DEMO LOCAL con datos 100 % FICTICIOS (levantamiento-iva-datos.js + levantamiento-detalle-datos.js + levantamiento-rectificar-datos.js,
     este último sale tal cual de la réplica local). sbFetch simulado: no llama a ningún servidor. El Excel carga ExcelJS 4.4.0 desde cdnjs.
     ?escenario=todo → rango con «pagó de más»; por defecto, el remanente corregido afecta F29 fuera del rango. -->
<h2>Ficha ficticia · demo «Si rectificamos todo»</h2>
<p style="color:#C9A8CC;font-size:13px">Abre «Levantamiento de IVA», presiona Calcular y luego «Si rectificamos todo». <a style="color:#E39BE5" href="?escenario=todo">Ver escenario con «pagó de más»</a> · <a style="color:#E39BE5" href="?">Ver escenario con F29 fuera del rango</a></p>
<div id="det-liva"></div>
<div id="det-hcar"></div>
<script src="../assets/gestoor-menu.js"></script>
<script src="levantamiento-iva-datos.js"></script>
<script src="levantamiento-detalle-datos.js"></script>
<script src="levantamiento-rectificar-datos.js"></script>
<script>
  window.sbFetch = function (path, o) {
    var b = JSON.parse(o.body || '{}'), st = 200, j;
    if (path === 'rpc/sii_levantamiento_iva') j = window.LIVA_DEMO;
    else if (path === 'rpc/sii_historia_origenes') j = { meses: [] };
    else if (path === 'rpc/sii_levantamiento_pedir_historial') j = { estado: 'encolado', trabajo_id: 1, lecturas: 9, minutos_estimados: 6 };
    else if (path === 'rpc/sii_levantamiento_registrar_pdf' || path === 'rpc/sii_levantamiento_registrar_exportacion') j = { registrado: true, bitacora_id: 1 };
    else if (path === 'rpc/sii_levantamiento_detalle_mes') j = b.p_periodo === window.LIVA_DEMO.meses[7].periodo ? window.LIVD_SIN_DETALLE : window.LIVD_DETALLE;
    else if (path === 'rpc/sii_documentos_periodo') j = window.LIVD_DOCS[b.p_libro];
    else if (path === 'rpc/sii_levantamiento_borrador_f29') j = window.LIVD_BORRADOR;
    else if (path === 'rpc/sii_levantamiento_rectificar_todo') j = /escenario=todo/.test(location.search) ? window.LIVR_TODO : window.LIVR_PARCIAL;
    else if (path === 'rpc/sii_historial_cargado') j = window.LIVD_HISTORIAL;
    else if (path === 'rpc/sii_f29_codigos_mes') j = window.LIVD_F29;
    else { st = 404; j = { code: 'PGRST202' }; }
    return new Promise(function (r) { setTimeout(function () { r({ ok: st === 200, status: st, text: function () { return Promise.resolve(JSON.stringify(j)); } }); }, 150); });
  };
</script>
<script src="../clientes/levantamiento-iva.js"></script>
<script src="../clientes/levantamiento-detalle.js"></script>
<script src="../clientes/levantamiento-rectificar.js"></script>
<script src="../clientes/levantamiento-informe.js"></script>
<script src="../clientes/historial-sii-cargado.js"></script>
<script>
  var C = { id: 1, razon: 'Empresa Ficticia SpA', rut: '76.000.000-0' };
  GestoorLevIVA.montar(document.getElementById('det-liva'), C, { esMaster: true });
  GestoorHistorialSII.montar(document.getElementById('det-hcar'), C, { esMaster: true });
</script>
</body>
</html>
