<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Demo local · tarjeta SII (Cartapra F1)</title>
<!-- PRUEBA LOCAL: datos FICTICIOS/ANONIMIZADOS y Edge simulada. No se conecta a Supabase ni a Cartapra.
     ?estado=no_conectada|leyendo|conectada|clave_rechazada|sin_permiso|conector  ·  &conectar=0 → el servidor responde puede_conectar=false -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/gestoor.css">
<style>body{padding:24px}.modal{max-width:640px;margin:0 auto}.det-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.det-item{background:rgba(12,7,14,.35);border-radius:12px;padding:8px 12px}.det-lbl{font-size:10px;color:#C9A8CC;text-transform:uppercase}.det-val{font-size:13px;font-weight:600}
.demo-aviso{max-width:640px;margin:0 auto 12px;font:600 12px Inter,sans-serif;color:#5CC8FF}</style>
</head>
<body class="g-shell g-tema-noche">
<div class="demo-aviso">DEMO LOCAL · DATOS FICTICIOS · Edge simulada</div>
<div class="modal"><div class="modal-body" style="padding:22px">
  <h2 class="g-ficha-t" style="font-size:18px;margin-bottom:4px">Empresa Ficticia SpA</h2>
  <div style="font-size:12px;color:#9a849b;margin-bottom:14px">76000000-0 · Servicios de prueba</div>
  <div class="det-grid">
    <div class="det-item"><div class="det-lbl">Asesor(a) Contable</div><div class="det-val">Analista de prueba</div></div>
    <div class="det-item"><div class="det-lbl">Valor mensual</div><div class="det-val">3 UF</div></div>
  </div>
  <div id="det-sii"></div>
</div></div>
<script src="../assets/gestoor-menu.js"></script>
<script src="cartapra-sii-fixture.js"></script>
<script>
  var q = new URLSearchParams(location.search);
  var est = q.get('estado') || 'conectada', puede = q.get('conectar') !== '0';
  var C = function (e, x) { return Object.assign({ estado: e, ultimaActualizacion: null, actualizando: false, cargaInicialLista: false, ultimoError: null }, x || {}); };
  var vacio = function (c) { return { ok: true, conexion: c, puede_conectar: puede, ficha: null, f29: null, monitor: null, sii: {} }; };
  var FX = JSON.parse(JSON.stringify(window.CARTAPRA_FIXTURE_RESUMEN)); FX.puede_conectar = puede;
  var R = {
    no_conectada: { s: 200, b: vacio(C('no_conectada')) },
    leyendo: { s: 200, b: vacio(C('conectada', { actualizando: true })) },
    clave_rechazada: { s: 200, b: vacio(C('clave_rechazada', { ultimaActualizacion: '2026-11-10T12:00:00Z', ultimoError: 'El SII rechazó la clave' })) },
    sin_permiso: { s: 403, b: { ok: false, error: 'SIN_PERMISO' } },
    conector: { s: 403, b: { ok: false, error: 'SIN_PERMISO' } },   // resumen 403; "estado" sí responde (conector no asignado)
    conectada: { s: 200, b: FX }   // forma REAL (R2), datos anonimizados
  };
  window.toast = function (m) { console.log('toast', m); };
  window.edgeFetch = function (fn, body) {
    var r = body.accion === 'ventana' ? { s: 200, b: { ok: true, widget: { url: 'https://app.cartapra.com/conecta-widget/DEMO' } } }
      : body.accion === 'estado' ? (est === 'conector' ? { s: 200, b: { ok: true, conexion: C('no_conectada'), puede_conectar: true } } : { s: 403, b: { ok: false, error: 'SIN_PERMISO' } })
      : R[est];
    return new Promise(function (ok) { setTimeout(function () { ok({ ok: r.s < 300, status: r.s, json: function () { return Promise.resolve(r.b); } }); }, 150); });
  };
</script>
<script src="../clientes/sii-cartapra.js"></script>
<script>GestoorSII.montar(document.getElementById('det-sii'), 7);</script>
</body>
</html>
